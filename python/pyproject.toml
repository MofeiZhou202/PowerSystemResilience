[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hysim-xjtu"
version = "0.1.0"
description = "Typed Python SDK and AI tool framework for HySim-XJTU-HRPES"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "XJTU HRPES"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
